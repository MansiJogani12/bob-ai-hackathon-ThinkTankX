submission:
  title: "S1 Wafer Yield Root Cause & Defect Pattern Analyser"

  problem_statement: >
    At 3nm and 5nm nodes, even a small drop in wafer yield can cost tens of millions of dollars per month.
    Root causes are spread across thousands of equipment signals, process parameters, and defect observations,
    making manual investigation slow and expensive. Teams need to identify at-risk batches earlier and explain
    the likely process drivers behind yield loss.

  solution_summary: >
    YieldSentinel AI combines a trained XGBoost model, median-imputation preprocessing, and SHAP-based explanations
    with a FastAPI backend and a Next.js dashboard for batch analysis, wafer scoring, root-cause review,
    and defect-pattern investigation.

  key_features:
    - "Wafer-level pass/fail prediction using XGBoost"
    - "Batch CSV risk screening for multiple wafers"
    - "SHAP-based explanation of the strongest model contributors"
    - "Dashboard views for batch risk, wafer analysis, and root-cause trends"
    - "Defect-pattern and corrective-action investigation workflow"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "Next.js", "React", "Tailwind CSS"]
    ibm_technologies: []
    databases: []
    other: ["XGBoost", "SHAP", "pandas", "NumPy", "joblib", "Framer Motion"]

  what_we_are_most_proud_of: >
    We are most proud of combining predictive risk assessment with explainability so engineers can understand
    which signals matter most and which wafers or batches deserve investigation.

  known_limitations: >
    The project is a local prototype using a sample SECOM-style dataset and a packaged model artifact rather than a
    full manufacturing data pipeline. SHAP highlights the strongest model contributors but does not guarantee definitive
    physical root-cause proof, and the optional chat assistant depends on external configuration.

